name: Audit links & content health

on:
  schedule:
    - cron: '0 6 * * *' # 6am UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Read-only, but two runs would crawl the site twice over and could both open
# an issue about the same failure. The newer run is the one worth having.
concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # No secrets needed: audit-links.mjs reads the content files in this
      # repo and sends a HEAD to each published page.
      - name: Run audit
        id: audit
        run: node scripts/audit-links.mjs
        continue-on-error: true

      - name: Open or update an issue on failure
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "Automated audit found issues — see \`audit-report.json\` below."
            echo
            echo '```json'
            cat audit-report.json
            echo '```'
          } > "$BODY_FILE"

          EXISTING=$(gh issue list --label automated-audit --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create \
              --title "Knowledge base audit failed — $(date -u +%Y-%m-%d)" \
              --body-file "$BODY_FILE" \
              --label automated-audit
          fi

      - name: Fail the job if the audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
