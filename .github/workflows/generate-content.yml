name: Generate content (qa-gen / wine-gen)

# Manual dispatch only — no schedule. vault-scan is deliberately NOT an
# option here: content-generator.mjs's VAULTS point at absolute paths on
# Cath's own Mac (her Obsidian vaults), which don't exist anywhere in this
# git repo. A GitHub Actions runner only has what `actions/checkout` pulls
# from the repo, so vault-scan silently finds nothing and no-ops there
# ("Added 0 new chunks", exit 0 — confirmed by actually running it).
# vault-scan still works fine locally: `npm run content -- --mode=vault-scan`.
#
# qa-gen and wine-gen don't touch the local filesystem (Claude API +
# Supabase only), so those are the only modes that make sense to run from
# CI. No schedule because both need a specific --topic/--region a human
# picks, and (per the original design) Claude-authored content generation
# is meant to require an explicit human decision, not run unattended.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'qa-gen | wine-gen'
        required: true
        default: 'qa-gen'
        type: choice
        options:
          - qa-gen
          - wine-gen
      topic:
        description: 'qa-gen only: topic, e.g. "Chenin Blanc"'
        required: false
        type: string
      difficulty:
        description: 'qa-gen only: Beginner | Intermediate | Advanced'
        required: false
        type: string
      region:
        description: 'wine-gen only: region, e.g. "Priorat"'
        required: false
        type: string

# Calls the Anthropic API and writes drafts. Two overlapping runs would double
# the bill and could draft the same answers twice.
concurrency:
  group: generate-content
  cancel-in-progress: false

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run content generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/content-generator.mjs \
            --mode="${{ inputs.mode }}" \
            --topic="${{ inputs.topic }}" \
            --difficulty="${{ inputs.difficulty }}" \
            --region="${{ inputs.region }}"
