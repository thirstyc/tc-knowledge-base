name: Generate answer, difficulty, topic & catalog pages

on:
  schedule:
    - cron: '0 8 * * 0' # Sundays 8am UTC
  workflow_dispatch: {}

permissions:
  contents: write

# This job commits and pushes. Two overlapping runs would regenerate the same
# 2,930 pages and race on push, so they queue rather than run together --
# cancel-in-progress would be worse here, since a run killed between commit and
# push leaves the branch behind what it just generated.
concurrency:
  group: generate-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap's <lastmod> comes from each content file's
      # last real commit (lib/content-dates.mjs), and the default fetch-depth
      # of 1 cannot see it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # No secrets needed: reads Supabase with the public anon key, same as
      # audit-links.mjs. Never overwrites a hand-authored file (see
      # GENERATED_MARKER in the script) and never touches audience pages —
      # there's no audience field in the schema to generate them from.
      - name: Generate pages
        run: node scripts/generate-missing-pages.mjs

      # After answer pages, so topic-page rows can link to any answer page
      # generated in the previous step. Exits 1 (failing the run, committing
      # nothing) if a topic fetch fails; failed topics keep their old file.
      - name: Generate topic pages
        run: node generate-topic-pages.mjs

      # grapes.html / regions.html / guides.html. Same failure rule as above.
      - name: Generate catalog pages
        run: node scripts/generate-catalog-pages.mjs

      # After the catalog pages, because it indexes the generated HTML rather
      # than the content files -- so every href it records is a page that
      # exists, in the spelling it is published under.
      - name: Regenerate the search index
        run: node scripts/generate-search-index.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      # After the sitemap, since it records the sitemap's URL count. Only
      # rewrites metadata.json when a count changed.
      - name: Regenerate metadata.json
        run: node scripts/generate-metadata.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new or changed pages."
          else
            git commit -m "Auto-generate answer, topic and catalog pages, search index and metadata from content/"
            git push
          fi
