name: Generate answer & difficulty pages

on:
  schedule:
    - cron: '0 8 * * 0' # Sundays 8am UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # No secrets needed: reads Supabase with the public anon key, same as
      # audit-links.mjs. Never overwrites a hand-authored file (see
      # GENERATED_MARKER in the script) and never touches audience pages —
      # there's no audience field in the schema to generate them from.
      - name: Generate pages
        run: node scripts/generate-missing-pages.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new or changed pages."
          else
            git commit -m "Auto-generate answer/difficulty pages from knowledge_chunks"
            git push
          fi
